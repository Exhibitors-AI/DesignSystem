<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded, softer version. E with rounded terminals, chevrons with rounded joins. Everything same weight, same caps. Feels cohesive and modern. -->
  <!-- E as rounded strokes -->
  <path d="M12,10 L12,54" fill="none" stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M12,10 C12,10 22,10 30,10" fill="none" stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M12,32 C12,32 20,32 26,32" fill="none" stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M12,54 C12,54 22,54 30,54" fill="none" stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Double chevron, same weight and rounding -->
  <path d="M30,14 Q30,14 42,32 Q42,32 30,50" fill="none" stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40,14 Q40,14 52,32 Q52,32 40,50" fill="none" stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
