<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Merges 5+7 directly: E spine with arms that end in arrow points, connected by diagonal flow lines. Single color, all lines same weight. -->
  <!-- Vertical spine -->
  <line x1="16" y1="10" x2="16" y2="54" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <!-- Top arm flowing into arrow -->
  <path d="M16,10 L40,10 L48,16 L40,22" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle arm flowing into arrow -->
  <path d="M16,32 L34,32 L42,38" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom arm flowing into arrow -->
  <path d="M16,54 L40,54 L48,48 L40,42" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Diagonal flow connections (network feel from 07) -->
  <line x1="40" y1="22" x2="34" y2="32" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="40" y2="42" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
</svg>
