<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Theme: Technology — Stylized E made from connected nodes -->
  <!-- Vertical spine -->
  <line x1="18" y1="12" x2="18" y2="52" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <!-- Three horizontal arms -->
  <line x1="18" y1="12" x2="46" y2="12" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="40" y2="32" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <line x1="18" y1="52" x2="46" y2="52" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <!-- Nodes at endpoints -->
  <circle cx="46" cy="12" r="4" fill="#2a9d8f"/>
  <circle cx="40" cy="32" r="4" fill="#2a9d8f"/>
  <circle cx="46" cy="52" r="4" fill="#2a9d8f"/>
  <circle cx="18" cy="12" r="4" fill="#1e7a6f"/>
  <circle cx="18" cy="32" r="4" fill="#1e7a6f"/>
  <circle cx="18" cy="52" r="4" fill="#1e7a6f"/>
  <!-- Connecting diagonals (network feel) -->
  <line x1="46" y1="12" x2="40" y2="32" stroke="#2a9d8f" stroke-width="1.5" opacity="0.3"/>
  <line x1="40" y1="32" x2="46" y2="52" stroke="#2a9d8f" stroke-width="1.5" opacity="0.3"/>
</svg>
