<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Double chevron overlapping a bold E. The chevrons sit on top of the right side of the E, partially obscuring the arm endpoints. Single color. -->
  <!-- E letterform -->
  <rect x="8" y="8" width="8" height="48" fill="#2a9d8f"/>
  <rect x="8" y="8" width="28" height="8" fill="#2a9d8f"/>
  <rect x="8" y="28" width="22" height="8" fill="#2a9d8f"/>
  <rect x="8" y="48" width="28" height="8" fill="#2a9d8f"/>
  <!-- Double chevron overlapping right side -->
  <polyline points="32,16 46,32 32,48" fill="none" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="42,16 56,32 42,48" fill="none" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
