<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cleanest interpretation. The tilted diamond envelope drawn as one continuous line. Three bars extend from the left vertex. The flap chevron sits inside. All uniform weight, all rounded. Minimal path, maximum clarity. -->
  <!-- Diamond envelope: one stroke from top, around, back to top -->
  <path d="M22,8 L52,32 L22,56 L22,8 Z" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flap chevron inside -->
  <polyline points="26,14 46,30 26,46" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three bars from left vertex, drawn as one continuous zigzag -->
  <path d="M4,20 L18,20 L18,32 L4,32 L4,44 L18,44" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
