  <!-- Chevrons cutting across -->
  <polyline points="26,14 40,32 26,50" fill="none" stroke="#2a9d8f" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="38,14 52,32 38,50" fill="none" stroke="#2a9d8f" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
