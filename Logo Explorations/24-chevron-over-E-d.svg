<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Heavier, more compact. E is bold filled, chevrons cut through its right edge. The overlap creates a sense of the E launching the chevrons forward. -->
