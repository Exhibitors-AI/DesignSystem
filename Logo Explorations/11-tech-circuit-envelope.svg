<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Theme: Technology + Email — Envelope shape with circuit-board trace lines -->
  <rect x="8" y="18" width="48" height="32" rx="4" fill="none" stroke="#2a9d8f" stroke-width="3"/>
  <polyline points="8,18 32,38 56,18" fill="none" stroke="#2a9d8f" stroke-width="3" stroke-linejoin="round"/>
  <!-- Circuit traces extending from corners -->
  <line x1="8" y1="50" x2="8" y2="58" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="8" cy="60" r="2" fill="#2a9d8f"/>
  <line x1="56" y1="50" x2="56" y2="58" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="56" cy="60" r="2" fill="#2a9d8f"/>
  <line x1="32" y1="50" x2="32" y2="58" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="60" r="2" fill="#2a9d8f"/>
  <!-- Top traces -->
  <line x1="20" y1="18" x2="20" y2="8" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="6" r="2" fill="#2a9d8f"/>
  <line x1="44" y1="18" x2="44" y2="8" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="6" r="2" fill="#2a9d8f"/>
</svg>
