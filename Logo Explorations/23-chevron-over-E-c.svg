<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- E as strokes (matching chevron weight) so everything feels unified. All same stroke width. -->
  <!-- E spine and arms as strokes -->
  <line x1="12" y1="10" x2="12" y2="54" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <line x1="12" y1="10" x2="32" y2="10" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="28" y2="32" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <line x1="12" y1="54" x2="32" y2="54" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <!-- Double chevron, same weight, overlapping -->
  <polyline points="30,14 42,32 30,50" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="40,14 52,32 40,50" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
