<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Theme: Magic + Speed — Two overlapping shapes suggesting transformation (contact → email) -->
  <!-- Contact card (back, lighter) -->
  <rect x="6" y="14" width="32" height="22" rx="4" fill="#2a9d8f" opacity="0.35"/>
  <!-- Email envelope (front, bold) -->
  <rect x="26" y="28" width="32" height="22" rx="4" fill="#2a9d8f"/>
  <polyline points="26,28 42,40 58,28" fill="none" stroke="#1e7a6f" stroke-width="2" stroke-linejoin="round"/>
  <!-- Curved arrow connecting them (transformation) -->
  <path d="M30,18 Q48,8 50,24" fill="none" stroke="#c2783a" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="50,24 54,20 52,27" fill="#c2783a"/>
</svg>
