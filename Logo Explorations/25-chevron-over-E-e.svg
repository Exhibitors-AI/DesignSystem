<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Minimal: the E's middle arm IS the first chevron's left leg. The forms share geometry. -->
  <!-- E spine -->
  <line x1="10" y1="10" x2="10" y2="54" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <!-- Top arm -->
  <line x1="10" y1="10" x2="34" y2="10" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom arm -->
  <line x1="10" y1="54" x2="34" y2="54" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <!-- Middle arm flows directly into first chevron -->
  <polyline points="10,32 34,32 46,18" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="34" y1="32" x2="46" y2="46" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <!-- Second chevron -->
  <polyline points="42,18 54,32 42,46" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
