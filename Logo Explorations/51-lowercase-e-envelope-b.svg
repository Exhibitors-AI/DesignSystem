<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Lowercase e with the crossbar extending right into a chevron point. The open tail of the e and the chevron create forward motion. -->
  <path d="
    M48,30 L12,30
    Q8,30 8,24 Q8,8 32,8 Q56,8 56,30
    Q56,52 32,56 Q16,56 10,46
  " fill="none" stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chevron extending from crossbar -->
  <polyline points="48,30 58,20" fill="none" stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
