<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Two stacked envelopes offset slightly, suggesting speed/multiplication. Same stroke weight, same rounding. The overlap creates depth with one color. -->
  <!-- Back envelope (offset up-left) -->
  <rect x="4" y="14" width="40" height="28" rx="5" ry="5" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="4,18 24,34 44,18" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front envelope (offset down-right) -->
  <rect x="20" y="22" width="40" height="28" rx="5" ry="5" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="20,26 40,42 60,26" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
