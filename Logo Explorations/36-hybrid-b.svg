<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Open envelope with chevrons rising, but the chevrons are staggered horizontal bars (like the Inbox reference's colored bars, but as chevron shapes). Creates rhythm. -->
  <!-- Envelope body -->
  <path d="M8,34 L8,54 Q8,58 12,58 L52,58 Q56,58 56,54 L56,34" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Envelope V -->
  <polyline points="8,34 32,50 56,34" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three staggered chevron-bars rising upward, progressively wider -->
  <line x1="24" y1="26" x2="40" y2="26" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="17" x2="44" y2="17" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <line x1="16" y1="8" x2="48" y2="8" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
</svg>
