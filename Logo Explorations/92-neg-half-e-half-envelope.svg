  <path d="M32,4 Q56,4 56,32 Q56,60 32,60" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#faf8f4" stroke-width="4" stroke-linecap="round"/>
</svg>