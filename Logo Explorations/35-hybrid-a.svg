<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Open envelope angled slightly, with three horizontal bars emerging from the left side (like the Inbox reference). The bars read as both E arms and as content/energy spilling out. Uniform stroke, rounded. -->
  <!-- Envelope body (right side, angled open) -->
  <path d="M28,18 L56,18 Q60,18 60,22 L60,50 Q60,54 56,54 L28,54" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Envelope flap chevron -->
  <polyline points="28,22 44,36 60,22" fill="none" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three bars emerging left (E arms / energy lines) -->
  <line x1="4" y1="24" x2="28" y2="24" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <line x1="8" y1="36" x2="28" y2="36" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
  <line x1="4" y1="48" x2="28" y2="48" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/>
</svg>
